<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Break Fast Scramble</title>
<style>
  :root{--bg:#121214;--panel:#1c1c20;--line:#2c2c33;--fg:#e6e6ea;--dim:#8a8a96;--K:#e5533d;--S:#f2c14e;--g:#8f7a3e;--h:#4b6a8a;--acc:#7be0c3}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
  label{color:var(--dim);display:flex;gap:6px;align-items:center}
  input[type=number]{width:56px}
  input,select,button,textarea{background:#26262c;color:var(--fg);border:1px solid var(--line);border-radius:4px;font:inherit;padding:4px 7px}
  button{cursor:pointer}button:hover{border-color:var(--acc)}
  button.pri{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
  #srcmap{padding:10px 18px;border-bottom:1px solid var(--line)}
  /* one fixed grid everywhere: 15px cells, 3px gutters; joins bridge the gutter instead of closing it, so columns always line up */
  #srcmap .row,.card .grid .row{display:flex;gap:3px;margin-bottom:3px}
  .cell.join{border-top-left-radius:0;border-bottom-left-radius:0}.cell.joinR{border-top-right-radius:0;border-bottom-right-radius:0}
  .cell.join::before{content:"";position:absolute;left:-3px;top:0;bottom:0;width:3px;background-color:inherit}
  .cell{width:15px;height:18px;border-radius:2px;font-size:8px;display:flex;align-items:center;justify-content:center;color:#0009;position:relative;flex:none}
  .card .cell{width:var(--cw,15px);height:var(--ch,18px);font-size:var(--cf,8px)}
  .card .rp{height:var(--ch,18px)}
  .cell.K{background-color:var(--K)}.cell.S{background-color:var(--S)}.cell.g{background-color:var(--g)}.cell.h{background-color:var(--h)}.cell.rest{background-color:#222;color:#555}
  .cell.rev{box-shadow:inset 0 0 0 2px #fff}
  .cell.rt{background-repeat:no-repeat}
  .cell.nt{background-color:#6c6c78;color:#fffc}
  body.posmode .cell[style*='--pc']{background-color:var(--pc);color:var(--pt,#000b)}
  body.posmode .kitonly,body:not(.posmode) .posonly{display:none}
  /* half speed: each source slice spans two steps, so its number is centred across the pair */
  .cell .hn{position:absolute;left:0;top:0;bottom:0;width:calc(200% + 3px);display:flex;align-items:center;justify-content:center;z-index:2;pointer-events:none}
  .cell.pu{border-top:3px solid #fff}.cell.pd{border-bottom:3px solid #000}
  .cell.now{outline:2px solid #fff;outline-offset:0}
  @keyframes beatPulse{0%{transform:scale(1.22);filter:brightness(1.35)}100%{transform:none;filter:none}}
  @keyframes barPulse{0%{transform:scale(1.32);filter:brightness(1.6)}100%{transform:none;filter:none}}
  .cell.pulse{animation:beatPulse .22s ease-out;z-index:1}.cell.pulseBar{animation:barPulse .3s ease-out;z-index:1}
  #srcmap .cell{cursor:pointer}
  .maphead{display:flex;gap:16px;margin-bottom:6px}
  .key{display:flex;flex-wrap:wrap;gap:0;margin-top:10px}
  .kg{display:flex;flex-direction:column;gap:6px;padding:0 18px;border-left:1px solid var(--line)}.kg:first-child{padding-left:0;border-left:0}
  .kr{display:flex;gap:14px}
  .ki{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--dim)}
  .kx{display:flex;align-items:center;height:18px;gap:3px}
  #srcmap .key .cell{cursor:default}
  main{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:12px;padding:14px 18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px}
  .card.playing{border-color:var(--acc)}
  /* one continuous pointer area across buttons, rows and the gaps between them (no cursor flicker crossing gutters) */
  .gwrap{display:flex;gap:0;cursor:pointer;position:relative}
  .ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;will-change:transform;filter:drop-shadow(0 8px 14px #000c) drop-shadow(0 2px 3px #0008)}
  .ghost .cell{border-radius:2px}
  .ghost.cloning::after{content:'+';position:absolute;right:-7px;top:-8px;width:14px;height:14px;border-radius:7px;background:var(--acc);color:#111;font:700 11px/14px ui-monospace,monospace;text-align:center}.ghost.flying{z-index:49;filter:drop-shadow(0 4px 8px #000a)}
  .cell.lifted{background-color:#1b1b20!important;background-image:none!important;color:transparent!important;box-shadow:inset 0 0 0 1px #34343c!important}
  .cell.lifted::before{display:none}
  @keyframes landed{0%{transform:scale(1.12);filter:brightness(1.4)}100%{transform:none;filter:none}}.cell.landed{animation:landed .22s ease-out}
  #selbar{position:fixed;z-index:40;display:none;align-items:center;gap:4px;padding:4px;background:#26262c;border:1px solid #3a3a44;border-radius:7px;box-shadow:0 8px 24px #000b}
  /* appears by rising out of the selected cells (no sliding from wherever it was last) */
  @keyframes sbRise{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
  @keyframes sbDrop{from{opacity:0;transform:translateY(-10px) scale(.94)}to{opacity:1;transform:none}}
  #selbar.show{display:flex;animation:sbRise .16s cubic-bezier(.2,.8,.2,1)}#selbar.show.below{animation-name:sbDrop}
  #selbar button{height:22px;padding:0 7px;font-size:10px;letter-spacing:.06em;border-radius:4px;background:#1f1f24}
  #selbar .sb-ico{display:grid;place-items:center;padding:0 6px}#selbar .sb-ico svg{width:14px;height:14px;pointer-events:none}
  #selbar button.on{background:var(--acc);color:#111;border-color:var(--acc)}
  #selbar .sb-grp{display:flex;gap:2px;align-items:center}#selbar .sb-p{min-width:22px;text-align:center;font-size:10px;color:var(--dim)}
  #selbar .sb-in{height:22px;min-width:4ch;padding:0 6px;font:11px/22px inherit;font-family:inherit;background:#141418;color:#fff;border:1px solid #3a3a44;border-radius:4px;outline:0;text-align:center}#selbar:not(.vals) .sb-in{display:none}#selbar.one .sb-in{display:block}#selbar.one .sb-vt{display:none}#selbar .sb-in:focus{border-color:var(--acc)}#selbar .sb-in.bad{border-color:#e5484d;animation:sbShake .25s}
  @keyframes sbShake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  #selbar::after{content:"";position:absolute;left:var(--ax,50%);bottom:-5px;width:8px;height:8px;margin-left:-4px;background:#26262c;border-right:1px solid #3a3a44;border-bottom:1px solid #3a3a44;transform:rotate(45deg)}
  #selbar.below::after{bottom:auto;top:-5px;transform:rotate(225deg)}
  .marq{position:fixed;border:1px dashed var(--acc);background:rgba(123,224,195,.12);pointer-events:none;z-index:5}
  .cell.sel{outline:2px solid var(--acc);outline-offset:-1px;z-index:2}.cell.drop{outline:2px dashed #fff;outline-offset:-1px;z-index:3}.cell.dropbad{outline:2px solid #e5533d;outline-offset:-1px}
  .card.editing .grid .row{cursor:default}.card.editing .cell.sel{cursor:grab}.rps{padding-right:2px}.card .grid,.card .grid .row{cursor:pointer}.rps{display:flex;flex-direction:column;gap:3px;padding-top:5px}
  .rp{width:16px;height:18px;padding:0;font-size:8px;line-height:1;border-radius:3px;color:var(--dim);background:transparent;border-color:transparent}
  .rp{opacity:0;transition:opacity .12s;cursor:pointer}.card:hover .rp{opacity:.35}.card .rp.hot,.card .rp:hover{opacity:1;color:var(--fg);border-color:var(--line)}.rp.q,.rp.on{opacity:1!important}
  /* while selecting / dragging / editing, the row ▶s stay out of the way (a queued one still shows) */
  .card.editing .rp:not(.q),body.dragging .rp:not(.q){opacity:0!important;pointer-events:none}.rp.on{color:#111;background:var(--acc);border-color:var(--acc)}
  .lgut{position:relative;width:12px;flex:none;cursor:ns-resize;margin-right:2px}
  .lbr{position:absolute;left:4px;width:4px;border-radius:2px;background:var(--acc);transition:top .12s ease-out,height .12s ease-out;pointer-events:none}
  .lbr::before,.lbr::after{content:"";position:absolute;left:0;width:8px;height:2px;background:var(--acc);border-radius:1px}.lbr::before{top:0}.lbr::after{bottom:0}
  .lbr.full{opacity:.4}.lgut:hover .lbr{opacity:1}
  .card .grid .row.outloop{opacity:.45}
  .card .btns button.dc{background:var(--acc);color:#111;border-color:var(--acc)}
  .rp.q{color:var(--acc);border:1px dashed var(--acc);animation:qblink .5s steps(1) infinite}
  @keyframes qblink{50%{border-color:var(--line)}}.card.queued{border-color:var(--acc);border-style:dashed;animation:qblink .5s steps(1) infinite}
  
  .card .top{display:flex;align-items:center;margin-bottom:8px;gap:8px}.card .top .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .top{cursor:grab}.card.ro .top,.card.ref .top{cursor:default}
  .card.ph{background:transparent;border:1px dashed #3a3a44}
  .card.lifting{box-shadow:0 14px 34px #000c;border-color:#3a3a44}
  .card.swaptg{outline:2px dashed var(--acc);outline-offset:-2px}
  .card .pl{width:30px;height:30px;padding:0;border-radius:50%;display:grid;place-items:center;flex:none;background:#2a2a31;border:1px solid #3a3a44;color:var(--fg)}
  .card .pl svg{width:13px;height:13px}.card .pl .i-play{margin-left:2px}.card .pl .i-stop{display:none}
  .card .pl:hover{border-color:var(--acc);color:var(--acc)}
  .card .pl.on{background:var(--acc);border-color:var(--acc);color:#111}.card .pl.on .i-play{display:none}.card .pl.on .i-stop{display:block}
  .card .pl.q{border:1px dashed var(--acc);color:var(--acc);animation:qblink .5s steps(1) infinite}
  .card .nm{font-weight:700;font-size:13px}.card .ico{display:flex;gap:2px}.card .ico button{width:24px;height:24px;padding:0;display:grid;place-items:center;background:none;border:0;color:var(--dim);border-radius:4px;cursor:pointer}.card .ico button:hover{color:#fff;background:#ffffff14}.card .ico svg{width:14px;height:14px}.card .ico .dl:hover{color:#ff6b6b}.card .ico .pn.on{color:var(--acc)}.card .ico .pn.on svg{fill:currentColor}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}.tags span{font-size:10px;color:var(--dim);background:#24242a;border-radius:3px;padding:1px 6px}.card .genes{color:var(--dim);font-size:11px;margin-bottom:6px;min-height:15px}
  #opts{display:flex;gap:8px}#opts label{gap:3px}
  /* beat lines behind the cells, flush against the left edge of steps 0, 4, 8, 12 (like a DAW grid), all the same weight */
  .card .grid,#srcmap .rows{width:fit-content;padding:5px 0 2px 3px;
    background-image:linear-gradient(90deg,rgba(255,255,255,.32) 0 2px,transparent 2px);
    background-size:72px 100%;background-position:1px 0;background-repeat:repeat-x}
  .card .grid{background-size:calc((var(--cw,15px) + 3px)*4) 100%}
  .card .grid .cell.cut{box-shadow:-2px 0 0 0 var(--acc)}
  .card .grid .cell.rev.cut{box-shadow:inset 0 0 0 2px #fff,-2px 0 0 0 var(--acc)}
  .card .btns{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
  .card .btns button{padding:3px 8px}.card.pinned{box-shadow:inset 0 2px 0 var(--acc)}.card .btns button:disabled{opacity:.3;cursor:default}
  #foot{padding:10px 18px 40px;border-top:1px solid var(--line)}
  textarea{width:100%;height:110px}
  #drop{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;font-size:22px;z-index:9}
  /* header = row of equal-height modules: caption row + 64px control row, everything centred on one line */
  header{display:flex;flex-wrap:wrap;align-items:stretch;border-bottom:1px solid var(--line);padding:12px 6px}
  .mod{display:grid;grid-template-rows:12px 64px;row-gap:8px;padding:0 18px;border-left:1px solid var(--line)}
  .mod:first-child{border-left:0}
  .mod>.row{display:flex;align-items:center;gap:16px}
  h1{font-size:13px;line-height:1.25;letter-spacing:.14em;margin:0;font-weight:700}
  .cap{color:var(--dim);font-size:9px;letter-spacing:.16em;line-height:12px}
  .knob{width:44px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:ns-resize;user-select:none;touch-action:none}
  .knob svg{width:36px;height:36px;display:block}
  .knob .v{font-size:11px;line-height:13px}.knob .l{font-size:8.5px;line-height:11px;color:var(--dim);letter-spacing:.14em}
  .knob.hero .v{color:var(--acc);font-weight:700}
  #tip{position:fixed;z-index:20;max-width:270px;background:#26262c;border:1px solid #3a3a44;border-radius:6px;padding:8px 10px;font-size:11px;line-height:1.45;color:var(--fg);box-shadow:0 6px 20px #000a;pointer-events:none;opacity:0;transition:opacity .12s;white-space:pre-line}
  #tip.show{opacity:1}
  body.dragging,body.dragging *{user-select:none!important;-webkit-user-select:none!important;cursor:var(--dragcur)!important}
  .kin{width:44px;height:13px;padding:0;font-size:11px;text-align:center;border-radius:2px;border-color:var(--acc)}
  .knob.off{opacity:.35;pointer-events:none}
  .seg,.togs{display:flex;gap:4px}
  .seg button,.tog{height:26px;padding:0 10px;font-size:10.5px;letter-spacing:.08em;border-radius:4px;background:#222228}
  .seg{gap:0}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:4px 0 0 4px;margin-left:0}.seg button:last-child{border-radius:0 4px 4px 0}
  .seg button.on,.tog.on{background:var(--acc);color:#111;border-color:var(--acc)}
  #gen{height:36px;padding:0 18px;letter-spacing:.1em}
  .mod.end{margin-left:auto}
  #status{color:var(--dim);font-size:11px;margin-left:12px}
  #dj{position:fixed;left:0;right:0;bottom:0;background:#18181c;border-top:1px solid var(--line);display:flex;padding:10px 6px;z-index:5}
  #dj .mod.fmod{flex:1;max-width:620px}
  #fader{flex:1;height:40px;display:flex;align-items:center;cursor:ew-resize;touch-action:none}
  #ftrack{position:relative;width:100%;height:6px;background:#2a2a31;border-radius:3px}
  #ftrack::before{content:"";position:absolute;left:50%;top:-8px;bottom:-8px;width:1px;background:#555}
  #ffill{position:absolute;top:0;bottom:0;background:var(--acc);border-radius:3px}
  #fcap{position:absolute;top:50%;width:18px;height:34px;margin:-17px 0 0 -9px;background:#ddd;border-radius:3px;box-shadow:0 2px 6px #0008;background-image:linear-gradient(#ddd 45%,#222 45%,#222 55%,#ddd 55%)}
  body{padding-bottom:110px}
  .card.ro{border-style:dashed}.card.ro .sh,.card.ro .pn,.card.ro .dl,.card.ref .dl,.card.ro .rs,.card.ref .sh{display:none}.card.ro .nm{letter-spacing:.12em}
  #keyTog{height:20px;padding:0 8px;font-size:10px;letter-spacing:.08em}
  body.nokey #srcmap .key{display:none}

</style>
</head>
<body>
<header>
  <div class="mod"><span></span><div class="row"><h1>BREAK<br>FAST<br>SCRAMBLE</h1></div></div>
  <div class="mod"><span class="cap">PATTERN</span><div class="row">
    <div class="seg" data-k="engine"><button data-v="mix" data-tip="MIX — picks ARR, CELLS or CHAOS at random for each pattern.">MIX</button><button data-v="arr" data-tip="ARR (arranger) — moves whole source bars in phrase shapes like A B A F, then builds the last bar as a fill from chunks (6-6-4, 3-3-2…). Closest to how your edit was made.">ARR</button><button data-v="cells" data-tip="CELLS — every bar is cut into chunks of 2–8 steps (e.g. 3+3+2), and each chunk is pulled from wherever in the break fits: kick on the 1, snare on 2 and 4.">CELLS</button><button data-v="chaos" data-tip="CHAOS — walks the break one 16th at a time: mostly carries on, sometimes jumps or repeats a slice. The most fragmented engine.">CHAOS</button></div>
    <div class="knob" data-k="chaos" data-min="0" data-max="1" data-step="0.01" data-def="0.35" data-label="CHAOS"></div>
  </div></div>
  <div class="mod"><span class="cap">START</span><div class="row">
    <button class="tog" data-k="lock" data-tip="LOCK — every pattern opens with the first STEPS slices of the source, untouched.">LOCK</button>
    <div class="knob" data-k="lockN" data-min="1" data-max="16" data-step="1" data-def="8" data-label="STEPS"></div>
  </div></div>
  <div class="mod"><span class="cap">ALLOW</span><div class="row"><div class="togs">
    <button class="tog" data-k="retrig" data-tip="RETRIG — stutter rolls: a slice retriggered inside one 16th, usually a snare at a phrase end. ×2 = 32nds, ×3 = 16th triplets, ×4 = 64ths. Shown as a cell split into that many parts.">RETRIG</button><button class="tog" data-k="pitch" data-tip="PITCH — rolls that ramp up in pitch, and half-time drags pitched down.">PITCH</button><button class="tog" data-k="rev" data-tip="REVERSE — the odd slice played backwards, usually just before a downbeat.">REVERSE</button><button class="tog" data-k="half" data-tip="HALF — half-speed drag: a segment of the break plays at half speed, so it lasts twice as long and drops an octave, like a slowing record. Lands at the end of a bar. With REVERSE also on, about 1 in 3 plays backwards: a rewind swell into the next downbeat.">HALF</button><button class="tog" data-k="gap" data-tip="GAPS — drops an occasional off-beat slice to silence.">GAPS</button>
  </div></div></div>
  <div class="mod"><span class="cap">COLOUR</span><div class="row">
    <div class="seg" data-k="colors"><button data-v="kit" data-tip="KIT — colour each step by drum: kick, snare, ghost, ride.">KIT</button><button data-v="pos" data-tip="POSITION — colour each step by where it sits in the source: dark blue at the start of the break through purple and orange to yellow at the end (readable with red-green colour blindness). Unbroken segments read as smooth gradients; jumps show as colour breaks you can trace back to the source map.">POSITION</button></div>
  </div></div>
  <div class="mod"><span class="cap">EDIT</span><div class="row">
    <button class="tog" data-k="live" data-tip="LIVE — while you drag a selection, the cards already show (and play) the swap or clone at the spot you're over. Move away and they go back; let go to keep it.">LIVE</button>
    <button class="tog" data-k="oneRow" data-tip="1 ROW — selections stay inside a single bar: a marquee only picks steps in the row it started on, and ⇧-click extends sideways only.">1 ROW</button>
  </div></div>
  <div class="mod end"><span></span><div class="row"><button class="pri" id="gen">GENERATE</button></div></div>
</header>
<div id="srcmap"></div>
<main id="cards"></main>
<div id="foot">
  <p>Paste a pattern to load it (one token per 16th, <code>|</code> between bars; <code>12r</code> reversed, <code>12x3</code> retrigger ×3, <code>12+5</code> pitch semitones, <code>.</code> rest):</p>
  <div style="display:flex;gap:6px"><input id="pasteIn" style="flex:1"><button id="pasteBtn">Load</button></div>

</div>
<div id="dj">
  <div class="mod"><span class="cap">PLAYBACK</span><div class="row">
    <div class="knob hero" data-k="out" data-min="80" data-max="200" data-step="0.5" data-def="165" data-label="BPM"></div>
    <div class="knob" data-k="swing" data-min="50" data-max="75" data-step="1" data-def="50" data-label="SWING"></div>
    <div class="seg" data-k="swU" data-tip="SWING ON — 16: every off-beat 16th is late (hats and ghost notes shuffle; jungle and garage feel). 8: the off-beat 8th is late, and the two 16ths inside each 8th stretch or squeeze to fit (a bigger, hip-hop or boogie lope)."><button data-v="16">16</button><button data-v="8">8</button></div>
    <div class="seg" data-k="mode"><button data-v="chop" data-tip="CHOP — each slice plays at its original pitch and is cut off when the next 16th starts. Keeps the tone; decays get shorter as BPM rises.">CHOP</button><button data-v="repitch" data-tip="REPITCH — the whole break is sped up like a sampler (165/140 ≈ +2.8 semitones). Nothing is cut; everything gets brighter and tighter.">REPITCH</button></div>
  </div></div>
  <div class="mod"><span class="cap">LAUNCH</span><div class="row">
    <div class="seg" data-k="q" data-tip="LAUNCH QUANTISE — when you press play on another pattern (or bar) while one is playing. BAR: switch at the next bar line. LOOP: let the current loop region finish first. NONE: switch instantly."><button data-v="bar">BAR</button><button data-v="loop">LOOP</button><button data-v="none">NONE</button></div>
  </div></div>
  <div class="mod fmod"><span class="cap">FILTER · <span id="fval">OFF</span></span><div class="row">
    <span class="cap">LP</span><div id="fader" data-tip="DJ filter — drag left for low-pass, right for high-pass, centre is off. Double-click to reset. Live only; WAV exports are dry (no filter, comp or verb)."><div id="ftrack"><div id="ffill"></div><div id="fcap"></div></div></div><span class="cap">HP</span>
    <div class="knob" data-k="res" data-min="0.5" data-max="18" data-step="0.1" data-def="4" data-label="RES"></div>
  </div></div>
  <div class="mod"><span class="cap">FX</span><div class="row">
    <div class="knob" data-k="comp" data-min="0" data-max="1" data-step="0.01" data-def="0" data-label="COMP"></div>
    <div class="knob" data-k="verb" data-min="0" data-max="1" data-step="0.01" data-def="0" data-label="VERB"></div>
  </div></div>
  <div class="mod"><span class="cap">OUTPUT</span><div class="row">
    <div class="knob" data-k="vol" data-min="0" data-max="1.2" data-step="0.01" data-def="0.85" data-label="VOL"></div>
  </div></div>
</div>
<div id="selbar"><button class="sb-vt" title="show / edit the slice values of the selection">VALUES ▸</button><input class="sb-in" spellcheck="false" autocomplete="off" title="slice numbers for the selected steps — type and press Enter. One number on several steps = a run from it (12 → 12 13 14…). Tokens work too: 12r reversed, 12x3 roll, 12+5 pitch, . rest. Esc cancels.">
  <button data-op="rev" title="reverse on/off">REV</button>

<script src="amen-data.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const ctx=new (window.AudioContext||window.webkitAudioContext)();
const master=ctx.createGain(),fLP=ctx.createBiquadFilter(),fHP=ctx.createBiquadFilter(),outG=ctx.createGain();
master.gain.value=0.85;fLP.type='lowpass';fHP.type='highpass';fLP.frequency.value=22000;fHP.frequency.value=10;
/* FX: filter → dry + reverb send → compressor (so the room pumps with the kit) → makeup → brickwall → out */
const vSend=ctx.createGain(),conv=ctx.createConvolver(),fxSum=ctx.createGain(),comp=ctx.createDynamicsCompressor(),mkup=ctx.createGain(),lim=ctx.createDynamicsCompressor();
vSend.gain.value=0;
conv.buffer=(()=>{const sr=ctx.sampleRate,len=Math.floor(sr*1.6),b=ctx.createBuffer(2,len,sr);   // small bright room: noise, a few early reflections, ~1.4 s tail
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++){const t=i/sr;d[i]=(Math.random()*2-1)*Math.exp(-t*4.2)*(t<0.012?t/0.012:1)}
    [0.013,0.021,0.034,0.047].forEach((t,k)=>{d[Math.floor((t+c*0.003)*sr)]+=0.6/(k+1)})}return b})();
lim.threshold.value=-1;lim.ratio.value=20;lim.knee.value=0;lim.attack.value=0.001;lim.release.value=0.08;
master.connect(fLP);fLP.connect(fHP);fHP.connect(fxSum);fHP.connect(vSend);vSend.connect(conv);conv.connect(fxSum);
fxSum.connect(comp);comp.connect(mkup);mkup.connect(lim);lim.connect(outG);outG.connect(ctx.destination);
function applyFx(){const t=ctx.currentTime,u=UI.comp??0,v=UI.verb??0;
  // COMP: one knob — threshold falls and ratio rises together; slow-ish attack lets the stick through, quick release pumps
  comp.threshold.setTargetAtTime(-u*32,t,0.02);comp.ratio.setTargetAtTime(1+u*11,t,0.02);comp.knee.value=4;comp.attack.value=0.006;comp.release.value=0.09;
  mkup.gain.setTargetAtTime(Math.pow(10,u*13/20),t,0.02);
  vSend.gain.setTargetAtTime(v*v*1.1,t,0.02)}
let buf=null,rbuf=null,slices=[],N=0;
const UI_DEF={live:true,oneRow:true,q:'bar',colors:'kit',src:140,out:165,mode:'chop',engine:'mix',chaos:0.35,lock:true,lockN:8,retrig:true,pitch:true,rev:true,half:true,gap:true,res:4,vol:0.85,filt:0,swing:50,swU:'16',comp:0,verb:0,keyOpen:true};
const UI=Object.assign({},UI_DEF,JSON.parse(localStorage.getItem('ascr.ui')||'{}'));
if('quant' in UI){if(!JSON.parse(localStorage.getItem('ascr.ui')||'{}').q)UI.q=UI.quant?'bar':'none';delete UI.quant} // migrate the old Q BAR toggle
[['oRetrig','retrig'],['oPitch','pitch'],['oRev','rev'],['oHalf','half'],['oGap','gap']].forEach(([o,k])=>{const v=localStorage.getItem('ascr.'+o);if(v!==null&&!localStorage.getItem('ascr.ui'))UI[k]=v==='1'});
const saveUI=()=>localStorage.setItem('ascr.ui',JSON.stringify(UI));
const S={get src(){return UI.srcBpm||140},get out(){return UI.out},get mode(){return UI.mode},get chaos(){return UI.chaos},get lock(){return UI.lock?Math.max(1,UI.lockN|0):0}};
const OPT={get retrig(){return UI.retrig},get pitch(){return UI.pitch},get rev(){return UI.rev},get half(){return UI.half},get gap(){return UI.gap}};
const BARS=4,SPB=16,LEN=BARS*SPB;

/* ---------- seeded rng ---------- */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pickW(r,items,w){let tot=0;for(const x of items)tot+=Math.max(0.01,w(x));let u=r()*tot;for(const x of items){u-=Math.max(0.01,w(x));if(u<=0)return x}return items[items.length-1]}
const chance=(r,p)=>r()<p;

/* ---------- audio load + analysis ---------- */
async function loadArrayBuffer(ab){
  buf=await ctx.decodeAudioData(ab);
  rbuf=ctx.createBuffer(buf.numberOfChannels,buf.length,buf.sampleRate);
  for(let c=0;c<buf.numberOfChannels;c++){const s=buf.getChannelData(c),d=rbuf.getChannelData(c);for(let i=0,n=s.length;i<n;i++)d[i]=s[n-1-i]}
  analyze();
}
function lp(x,fc,sr){const a=1-Math.exp(-2*Math.PI*fc/sr),y=new Float32Array(x.length);let v=0;for(let i=0;i<x.length;i++){v+=a*(x[i]-v);y[i]=v}return y}
function analyze(){
  const sr=buf.sampleRate,L=buf.length,m=new Float32Array(L);
  for(let c=0;c<buf.numberOfChannels;c++){const d=buf.getChannelData(c);for(let i=0;i<L;i++)m[i]+=d[i]/buf.numberOfChannels}
  const step=60/S.src/4; N=Math.max(1,Math.round(buf.duration/step));
  // transient envelope: first-difference energy per 1ms, log flux
  const hop=Math.round(sr*0.001),F=Math.floor(L/hop),flux=new Float32Array(F);let prev=0;
  for(let f=0;f<F;f++){let e=0;for(let i=f*hop+1;i<(f+1)*hop;i++){const d=m[i]-m[i-1];e+=d*d}const le=Math.log(e+1e-9);flux[f]=Math.max(0,le-prev);prev=le}
  // smoothed onset strength: rise over 3ms
  const on=new Float32Array(F);for(let f=3;f<F;f++)on[f]=flux[f]+flux[f-1]+flux[f-2];
  const sorted=[...on].sort((a,b)=>a-b),thr=sorted[Math.floor(F*0.9)];
  const l150=lp(m,150,sr),l300=lp(m,300,sr),l3k=lp(m,3000,sr),l7k=lp(m,7000,sr);
  const W2=Math.floor(0.002*sr),dbAt=t=>{const a=Math.max(0,Math.floor(t*sr));let e=0;for(let k=a;k<a+W2&&k<L;k++)e+=m[k]*m[k];return 10*Math.log10(e/W2+1e-12)};
  slices=[];
  for(let i=0;i<N;i++){
    const g=i*step;let best=-1,bt=g;
    // snap only to a real hit: biggest energy jump (2ms windows) within ±10ms of the grid, and only if it's ≥6dB
    let rise=-99;
    for(let t=Math.max(0.005,g-0.010);t<=g+0.010;t+=0.0005){const r=Math.max(dbAt(t+0.001),dbAt(t+0.003))-dbAt(t-0.004);if(r>rise){rise=r;bt=t}}
    best=rise;const snap=rise>=6;
    const start=snap?Math.max(0,bt-0.001):g;
    // features over first 60ms
    const a=Math.floor(start*sr),b=Math.min(L,a+Math.floor(0.06*sr));let lo=0,mid=0,hi=0,tot=0;
    for(let k=a;k<b;k++){lo+=l150[k]**2;mid+=(l3k[k]-l300[k])**2;hi+=(m[k]-l7k[k])**2;tot+=m[k]**2}
    slices.push({i,grid:g,start,snapped:snap,lo:Math.log(lo+1e-9),mid:Math.log(mid+1e-9),hi:Math.log(hi+1e-9),rms:Math.log(tot+1e-9)});
  }
  const z=k=>{const v=slices.map(s=>s[k]),mu=v.reduce((a,b)=>a+b)/v.length,sd=Math.sqrt(v.reduce((a,b)=>a+(b-mu)**2,0)/v.length)||1;slices.forEach(s=>s['z'+k]=(s[k]-mu)/sd)};
  ['lo','mid','hi','rms'].forEach(z);
  for(const s of slices){
    s.kick=s.zlo-0.4*s.zmid; s.snare=s.zmid-0.6*s.zlo;
    s.role= s.zlo>0.55&&s.kick>0.2?'K': (s.zmid>0.35&&s.snare>0.1?'S': (s.zrms>-0.5?'g':'h'));
  }
  drawSrcMap();
  $('#status').textContent=`${N} slices · ${buf.duration.toFixed(2)}s · ${slices.filter(s=>s.snapped).length} snapped to transients`;
}
function rtBg(x){const st=[];for(let q=1;q<x;q++){const at=(q*100/x).toFixed(2);st.push(`transparent calc(${at}% - 0.75px)`,`#000c calc(${at}% - 0.75px)`,`#000c calc(${at}% + 0.75px)`,`transparent calc(${at}% + 0.75px)`)}return `linear-gradient(90deg,${st.join(',')})`}
function keyHTML(){
  const c=(cls,t,st='')=>`<div class="cell ${cls}" style="${st}">${t}</div>`;
  const n=(cls,t,st='')=>c(cls.replace(/^\S+/,'nt'),t,st); // colour-agnostic example: shape only, same in KIT and POSITION
  const it=(ex,label)=>`<div class="ki"><div class="kx">${ex}</div><span>${label}</span></div>`;
  const grp=(cap,items)=>`<div class="kg"><span class="cap">${cap}</span><div class="kr">${items.join('')}</div></div>`;
  return `<div class="key">${[
    grp('DRUM',[it(c('K',0),'kick'),it(c('S',4),'snare'),it(c('g',8),'ghost'),it(c('h',5),'ride')]).replace('class="kg"','class="kg kitonly"'),
    grp('POSITION',[it(Array.from({length:8},(_,k)=>c('h'+(k?' join':'')+(k<7?' joinR':''),'',`--pc:${posColor(k*8)}`)).join(''),'bar 1 (dark) → bar 4 (light)')]).replace('class="kg"','class="kg posonly"'),
    grp('FLOW',[it(n('S joinR',4)+n('h join joinR',5)+n('h join',6),'unbroken run'),it(n('S',4)+n('K',10),'cut'),it(n('K',32,'box-shadow:-2px 0 0 0 var(--acc)'),'cut at bar start')]),
    grp('RETRIG',[it(n('S rt',4,'background-image:'+rtBg(2)),'×2 · 32nds'),it(n('S rt',4,'background-image:'+rtBg(3)),'×3 · triplets'),it(n('S rt',4,'background-image:'+rtBg(4)),'×4 · 64ths')]),
    grp('FX',[it(n('g rev',7),'reversed'),it(n('S pu',4),'pitch up'),it(n('h pd',9),'pitch down'),it(n('g hs joinR','<span class="hn">40</span>')+n('g hs join joinR','')+n('g hs join joinR','<span class="hn">41</span>')+n('g hs join',''),'half speed'),it(c('rest','·'),'rest')])
  ].join('')}</div>`;
}
function drawSrcMap(){
  const el=$('#srcmap');el.innerHTML='';
  const rows=document.createElement('div');rows.className='rows';el.appendChild(rows);
  for(let b=0;b*SPB<N;b++){const row=document.createElement('div');row.className='row';
    for(let i=b*SPB;i<Math.min(N,(b+1)*SPB);i++){const c=document.createElement('div');c.className='cell '+slices[i].role;if(i%SPB&&!isAccent(i)){c.classList.add('join');row.lastChild.classList.add('joinR')}c.textContent=i;c.title=`slice ${i} (${slices[i].role}) — click to audition`;
      c.onclick=()=>{ctx.resume();const nx=i+1<N?slices[i+1].start:buf.duration;schedStep(ctx,master,{s:i},ctx.currentTime+0.01,nx-slices[i].start,true)};row.appendChild(c)}
    rows.appendChild(row)}
  el.insertAdjacentHTML('afterbegin',`<div class="maphead"><span class="cap">SOURCE SLICES · CLICK TO HEAR · JOINED = A HIT AND ITS TAIL</span><span class="cap" style="margin-left:auto">EDIT: ⌘-DRAG / ⌘-CLICK TO SELECT · ⇧-CLICK EXTENDS · DRAG TO SWAP (ANY LOOP) · ⌥ TO CLONE · DELETE CLEARS · ⌘Z UNDO · ESC CLEARS</span><span id="status" class="cap"></span><button id="keyTog" title="show / hide the key">KEY ${UI.keyOpen?'▴':'▾'}</button></div>`);
  $('#keyTog').onclick=()=>{UI.keyOpen=!UI.keyOpen;saveUI();applyView();$('#keyTog').textContent='KEY '+(UI.keyOpen?'▴':'▾')};
  el.insertAdjacentHTML('beforeend',keyHTML());tagPos(el);
}

/* position colours: a 'plasma'-style ramp (dark blue → purple → orange → yellow). Its lightness rises steadily, so it reads
   for red-green colour vision too (deuteranomaly), unlike a rainbow. Start of the break is dark, end is light. */
const PLASMA=['#4c02a1','#7e03a8','#a92395','#cc4778','#e56b5d','#f89540','#fdc527','#f0f921'].map(h=>[1,3,5].map(k=>parseInt(h.slice(k,k+2),16)));
const posT=i=>(((i%N)+N)%N)/Math.max(1,N-1);
const posColor=i=>{const t=posT(i)*(PLASMA.length-1),a=Math.floor(t),f=t-a,A=PLASMA[a],B=PLASMA[Math.min(a+1,PLASMA.length-1)];return `rgb(${A.map((v,k)=>Math.round(v+(B[k]-v)*f)).join(',')})`};
const posText=i=>posT(i)<0.42?'#fffd':'#000b';
function tagPos(root){root.querySelectorAll('.cell').forEach(c=>{if(c.classList.contains('rest')||c.classList.contains('nt'))return;const n=c.dataset.s!=null?+c.dataset.s:parseInt(c.textContent);if(!isNaN(n)){c.style.setProperty('--pc',posColor(n));c.style.setProperty('--pt',posText(n))}})}
/* ---------- pattern format ---------- */
const tok=e=>e.s<0?'.':e.s+(e.r?'r':'')+(e.h?'h':'')+(e.x>1?'x'+e.x:'')+(e.p?(e.p>0?'+':'')+e.p:'');
function toStr(p){return p.map((e,i)=>(i&&i%SPB===0?'| ':'')+tok(e)).join(' ')}
function parse(str){const out=[];for(const t of str.trim().split(/\s+/)){if(t==='|')continue;if(t==='.'){out.push({s:-1});continue}
  const m=t.match(/^(\d+)(r)?(h)?(?:x(\d))?([+-]\d+)?$/);if(!m)throw Error('bad token '+t);out.push({s:+m[1],r:!!m[2],h:!!m[3],x:+(m[4]||1),p:+(m[5]||0)})}return out}
/* half-speed segments: consecutive 'h' steps (40h 40h 41h 41h …) are one sound — the source segment played once at 0.5× across them */
function annotateHalf(p){for(let i=0;i<p.length;i++){const e=p[i];delete e.hlen;delete e.hc;if(!e.h||e.s<0)continue;const pr=p[i-1];
  if(pr&&pr.h&&(e.s===pr.s||e.s===pr.s+1)&&(pr.hlen||pr.hc)){e.hc=true;let j=i-1;while(!p[j].hlen)j--;p[j].hlen++}else e.hlen=1}return p}
const ev=s=>({s:((s%N)+N)%N,r:false,x:1,p:0});
const run=(start,len)=>Array.from({length:len},(_,k)=>ev(start+k));

/* ---------- knowledge: where hits want to land ---------- */
// backbeat on 2 & 4 (steps 4,12) is the anchor of every dnb/jungle edit; kick on 1, with
// syncopated kicks on the "and of 3" region (10/11) and sometimes the "a of 1" (2/3).
const WANT={0:'K',4:'S',12:'S',10:'K',8:null};
function roleFit(i,pos){const w=WANT[pos%SPB],s=slices[i];if(!w)return 0;return w==='K'?s.kick:s.snare}
// cell groupings for a bar (sum 16). 3+3+2 family = tresillo/"dotted" feel; 6+6+4 = your edit's last bar.
const GROUPS={'4444':[4,4,4,4],'332_332':[3,3,2,3,3,2],'664':[6,6,4],'3334':[3,3,3,3,4],'33433':[3,3,4,3,3],'844':[8,4,4],'4462':[4,4,6,2],'88':[8,8],'5533':[5,5,3,3],'44422':[4,4,4,2,2],'6622':[6,6,2,2],'22222222':[2,2,2,2,2,2,2,2]};
const TEMPLATES=['ABAF','AABF','ABAB','AAAF','ABCF','ACAF','AFAF'];

/* ---------- learning weights ---------- */
const DEF_W={eng:{arr:1,cells:1,chaos:.5},tpl:Object.fromEntries(TEMPLATES.map(t=>[t,1])),grp:Object.fromEntries(Object.keys(GROUPS).map(g=>[g,1])),orn:{stut:1,rev:1,pitch:1,half:1}};
const W=DEF_W; // fixed weights (learning removed)

/* ---------- cell picking ---------- */
// a chunk start is only heard as a grouping accent if it begins on a kick or snare
const isAccent=i=>{const r=slices[((i%N)+N)%N].role;return r==='K'||r==='S'};
const ODD=g=>g.some(l=>l%4!==0); // groupings that cut across the beat (3s, 5s, 6s, 2s)
function pickCell(r,len,pos,prevEnd,accent){
  const ch=S.chaos;let best=[];
  for(let i=0;i<N;i++){
    let sc=0;
    sc+=2.0*roleFit(i,pos);                         // right drum on the strong positions
    sc+=(i%4===pos%4)?1.2*(1-ch):0;                 // keep the slice's place within the beat (preserves swing/accent)
    sc+=(i%SPB===pos%SPB)?0.6*(1-ch):0;             // or its exact place in the bar
    if(prevEnd!=null&&i===prevEnd%N)sc+=1.5*(1-ch); // plain continuation
    if(i+len>N)sc-=2;                               // avoid wrapping past the end
    if(accent)sc+=isAccent(i)?3:-1;                 // odd groupings: start each chunk on a hit so the grouping is audible
    best.push([sc+r()*(0.8+3*ch),i]);
  }
  best.sort((a,b)=>b[0]-a[0]);return best[0][1];
}
function fillBar(r,ctxBars,genes,gname){
  const gk=gname||pickW(r,Object.keys(GROUPS),k=>W.grp[k]);genes.grp=(genes.grp||[]).concat(gk);
  const g=GROUPS[gk],odd=ODD(g),out=[];let pos=0,last=null,lastLen=0;
  const prevBar=ctxBars[ctxBars.length-1]||run(0,16),pRep=0.8-0.4*S.chaos;
  for(let k=0;k<g.length;k++){
    const len=g[k];let start;const u=r();
    if(last!=null&&len===lastLen&&r()<pRep)start=last;                     // repeat the chunk: 3-3 / 6-6 is heard as "that again"
    else if(k===0&&u<0.55)start=prevBar[SPB-len].s;                         // take the tail of the bar before
    else if(u<0.7&&prevBar[pos])start=prevBar[pos].s;                       // keep the underlying bar here
    else start=pickCell(r,len,pos,null,odd);
    if(odd&&!isAccent(start)&&start!==last&&r()<0.85)start=pickCell(r,len,pos,null,true);
    out.push(...run(start,len));last=start;lastLen=len;pos+=len;
  }
  return out;
}
function cellBar(r,genes,pos0,lockSteps){
  const gk=pickW(r,Object.keys(GROUPS),k=>W.grp[k]);genes.grp=(genes.grp||[]).concat(gk);
  const g=GROUPS[gk],odd=ODD(g),out=[];let pos=0,prevEnd=null,last=null,lastLen=0;const pRep=0.65-0.4*S.chaos;
  for(const len of g){
    let start;
    if(pos0+pos<lockSteps)start=pos0+pos;
    else if(odd&&last!=null&&len===lastLen&&r()<pRep)start=last;
    else start=pickCell(r,len,pos,prevEnd,odd);
    out.push(...run(start,len));prevEnd=start+len;last=start;lastLen=len;pos+=len;
  }
  return out;
}

/* ---------- engines ---------- */
function genArranger(r,genes){
  const tpl=pickW(r,TEMPLATES,t=>W.tpl[t]);genes.tpl=tpl;
  const nb=Math.max(1,Math.floor(N/SPB));
  const A=S.lock?0:Math.floor(r()*nb);let B=Math.floor(r()*nb);if(nb>1)while(B===A)B=Math.floor(r()*nb);
  const bars=[];
  for(const L of tpl){
    if(L==='A')bars.push(run(A*SPB,16));
    else if(L==='B')bars.push(run(B*SPB,16));
    else if(L==='C'){const o=Math.floor(r()*nb);bars.push(run(A*SPB,8).concat(run(o*SPB+8,8)))} // half-bar swap
    else bars.push(fillBar(r,bars,genes));
  }
  return bars.flat();
}
function genCells(r,genes){
  const bars=[];const lock=S.lock;
  for(let b=0;b<BARS;b++){
    if(b===2&&chance(r,0.5)){bars.push(bars[0].map(e=>({...e})));genes.rep=1;continue}
    bars.push(b===BARS-1?fillBar(r,bars,genes):cellBar(r,genes,b*SPB,b===0?lock:0));
  }
  return bars.flat();
}
function genChaos(r,genes){
  const ch=S.chaos,out=[];let cur=0;
  for(let i=0;i<LEN;i++){
    if(i<S.lock){out.push(ev(i));cur=i;continue}
    const u=r(),pc=0.72-0.45*ch;
    if(u<pc)cur=cur+1;
    else if(u<pc+0.08+0.1*ch)cur=cur;                   // repeat slice
    else cur=pickCell(r,1,i%SPB,cur+1);
    out.push(ev(cur));
  }
  if(S.lock)out.splice(0,S.lock,...run(0,S.lock));
  return out;
}
/* ornaments: stutter rolls, reverses, pitch ramps, half-time drag — mostly at phrase ends */
function ornament(r,p,genes){
  const ch=S.chaos,o=[];
  const ends=[SPB*2-4,SPB*4-4];
  if(chance(r,(0.25+0.6*ch)*W.orn.stut/(W.orn.stut+1)*2)){ // snare roll / retrigger at the end of the phrase

  el.innerHTML=`<svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="17" fill="#202026" stroke="#2f2f37" stroke-width="4"/><path class="a" fill="none" stroke="var(--acc)" stroke-width="4" stroke-linecap="round"/><line class="n" x1="22" y1="22" x2="22" y2="9" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg><span class="v"></span><span class="l">${el.dataset.label}</span>`;
  const draw=()=>{const v=(UI[k]-min)/(max-min);el.querySelector('.a').setAttribute('d',v>0.001?ARC(v):'');el.querySelector('.n').setAttribute('transform',`rotate(${-135+270*v} 22 22)`);el.querySelector('.v').textContent=fmtK[k](UI[k])};
  const set=(v,commit)=>{v=Math.min(max,Math.max(min,Math.round(v/st)*st));v=+v.toFixed(4);if(v===UI[k])return;UI[k]=v;draw();saveUI();if(k!=='src'&&onK[k])onK[k](v);if(commit&&k==='src')onK.src()};
  let y0,v0,moved;
  el.onpointerdown=e=>{if(e.target.closest('.kin'))return;e.preventDefault();el.setPointerCapture(e.pointerId);y0=e.clientY;v0=UI[k];moved=false;dragOn('ns-resize')};
  el.onpointermove=e=>{if(y0==null)return;if(e.buttons===0){el.onpointerup(e);return}const dy=y0-e.clientY;if(Math.abs(dy)>1)moved=true;set(v0+dy*(max-min)/(e.shiftKey?800:180))};
  el.onpointerup=el.onpointercancel=el.onlostpointercapture=()=>{if(y0==null)return;y0=null;dragOff();if(moved&&k==='src')onK.src()};
  el.onwheel=e=>{e.preventDefault();set(UI[k]-Math.sign(e.deltaY)*st*(e.shiftKey?1:(max-min)/st>50?2:1),true)};
  el.ondblclick=()=>{const v=el.querySelector('.v'),inp=document.createElement('input');inp.className='kin';inp.value=UI[k];v.replaceWith(inp);inp.focus();inp.select();
    let done=false;const fin=ok=>{if(done)return;done=true;inp.replaceWith(v);if(ok){const t=inp.value.trim();set(t===''?def:+t||UI[k],true)}draw()};
    inp.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')fin(true);if(e.key==='Escape')fin(false)};inp.onblur=()=>fin(true);inp.onpointerdown=e=>e.stopPropagation()};
  el.dataset.tip=(KTIP[k]||el.dataset.label)+'\n\nDrag up/down (shift = fine) · scroll · double-click to type, blank resets.';draw();
}
document.querySelectorAll('.knob').forEach(setupKnob);
document.querySelectorAll('.seg').forEach(seg=>{const k=seg.dataset.k,draw=()=>seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===UI[k]));
  seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{UI[k]=b.dataset.v;saveUI();draw();applyView()});draw()});
function applyView(){document.body.classList.toggle('posmode',UI.colors==='pos');document.body.classList.toggle('nokey',!UI.keyOpen)}
applyView();
const syncDeps=()=>$('.knob[data-k=lockN]').classList.toggle('off',!UI.lock);
document.querySelectorAll('.tog').forEach(b=>{const k=b.dataset.k,draw=()=>{b.classList.toggle('on',!!UI[k]);syncDeps()};b.onclick=()=>{UI[k]=!UI[k];saveUI();draw()};draw()});
/* popovers */
(()=>{const tip=$('#tip');let tm=null,cur=null;
  const hide=()=>{clearTimeout(tm);tip.classList.remove('show');cur=null};
  document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tip]');if(el===cur)return;hide();if(!el||e.buttons)return;cur=el;
    tm=setTimeout(()=>{tip.textContent=el.dataset.tip;const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
      let x=Math.min(innerWidth-w-8,Math.max(8,r.left+r.width/2-w/2)),y=r.bottom+8;if(y+h>innerHeight-8)y=r.top-h-8;
      tip.style.left=x+'px';tip.style.top=y+'px';tip.classList.add('show')},350)});
  document.addEventListener('pointerdown',hide,true);addEventListener('scroll',hide,true)})();
/* DJ filter: one bipolar fader. left = low-pass sweeping down, right = high-pass sweeping up, centre = bypass */
function applyFilter(){
  const x=UI.filt,t=ctx.currentTime,q=UI.res,dead=0.03;
  let lp=22000,hp=10,lpq=0.0001,hpq=0.0001,txt='OFF';
  if(x<-dead){const u=(-x-dead)/(1-dead);lp=22000*Math.pow(60/22000,u);lpq=q;txt='LP '+(lp>=1000?(lp/1000).toFixed(1)+'k':Math.round(lp))+'Hz'}
  else if(x>dead){const u=(x-dead)/(1-dead);hp=10*Math.pow(9000/10,u);hpq=q;txt='HP '+(hp>=1000?(hp/1000).toFixed(1)+'k':Math.round(hp))+'Hz'}
  fLP.frequency.setTargetAtTime(lp,t,0.015);fHP.frequency.setTargetAtTime(hp,t,0.015);
  fLP.Q.setTargetAtTime(x<-dead?q:0.7,t,0.02);fHP.Q.setTargetAtTime(x>dead?q:0.7,t,0.02);
  $('#fval').textContent=txt;
  const pc=(x+1)/2*100;$('#fcap').style.left=pc+'%';const f=$('#ffill');f.style.left=Math.min(50,pc)+'%';f.style.width=Math.abs(pc-50)+'%';
}
(()=>{const fd=$('#fader'),tr=$('#ftrack');let drag=false;
  const at=e=>{const r=tr.getBoundingClientRect();let x=((e.clientX-r.left)/r.width)*2-1;x=Math.max(-1,Math.min(1,x));if(Math.abs(x)<0.04)x=0;UI.filt=x;applyFilter();saveUI()};
  fd.onpointerdown=e=>{e.preventDefault();fd.setPointerCapture(e.pointerId);drag=true;dragOn('ew-resize');at(e)};fd.onpointermove=e=>{if(!drag)return;if(e.buttons===0){drag=false;dragOff();return}at(e)};fd.onpointerup=fd.onpointercancel=fd.onlostpointercapture=()=>{if(!drag)return;drag=false;dragOff()};
  addEventListener('blur',()=>{if(drag){drag=false;dragOff()}});
  fd.ondblclick=()=>{UI.filt=0;applyFilter();saveUI()};
  fd.onwheel=e=>{e.preventDefault();UI.filt=Math.max(-1,Math.min(1,UI.filt-Math.sign(e.deltaY)*0.04));if(Math.abs(UI.filt)<0.03)UI.filt=0;applyFilter();saveUI()};
  outG.gain.value=UI.vol;applyFilter();applyFx()})();
window.__t={render,parse,run,generate,slices:()=>slices,buf:()=>buf,S,toStr};
</script>
